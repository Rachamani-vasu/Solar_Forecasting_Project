<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account | SolarVision</title>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eee2d2;
    color: #3e2d24;
}

header {
    height: 76px;
    background: #3d3029;
    color: #f8f0e4;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 45px;
}

.logo {
    font-family: Georgia, serif;
    font-size: 28px;
    font-weight: bold;
}

header a {
    color: #f8f0e4;
    text-decoration: none;
}

.main {
    min-height: calc(100vh - 76px);
    display: flex;
    justify-content: center;
    align-items: center;
}

.card {
    width: 440px;
    background: #f8f0e4;
    padding: 40px;
    border-radius: 16px;
    border: 1px solid #d5c3b0;
}

h1 {
    font-family: Georgia, serif;
    margin-top: 0;
}

.subtitle {
    color: #806f62;
    margin-bottom: 25px;
}

label {
    display: block;
    margin: 12px 0 7px;
    font-weight: bold;
    font-size: 14px;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #d5c3b0;
    border-radius: 7px;
    background: #fffaf3;
}

button {
    width: 100%;
    margin-top: 22px;
    padding: 14px;
    border: none;
    border-radius: 7px;
    background: #735743;
    color: white;
    font-weight: bold;
}

.error {
    background: #ead1c8;
    color: #7b3325;
    padding: 12px;
    border-radius: 7px;
}

.login {
    text-align: center;
    margin-top: 20px;
}

.login a {
    color: #735743;
    font-weight: bold;
}

</style>

</head>

<body>

<header>

<div class="logo">
SolarVision
</div>

<a href="/">
Login
</a>

</header>

<div class="main">

<div class="card">

<h1>Create Account</h1>

<div class="subtitle">
Create a SolarVision user account.
</div>

{% if error %}
<div class="error">
{{ error }}
</div>
{% endif %}

<form method="POST">

<label>Full Name</label>
<input type="text" name="full_name" required>

<label>Email</label>
<input type="email" name="email" required>

<label>Username</label>
<input type="text" name="username" required>

<label>Password</label>
<input type="password" name="password" required>

<button type="submit">
CREATE USER ACCOUNT
</button>

</form>

<div class="login">
Already have an account?
<a href="/">Login</a>
</div>

</div>

</div>

</body>
</html>
